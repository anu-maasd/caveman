name: agent-conformance

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      check_latest:
        description: Also probe current upstream binaries (without publishing drift issues)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  real-engine-contract:
    if: false
    name: all profiles / real compression engine
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.16.0"
      - name: Validate registry, profile pins, and generated artifacts
        run: |
          node agents/compile.mjs
          git diff --exit-code -- agents/agents.json packages/cli/src/agents.generated.ts packages/cli/src/reserved-verbs.generated.ts
      - name: Require one pinned probe for every shipped profile
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const registry = JSON.parse(readFileSync("agents/agents.json", "utf8"));
          const workflow = readFileSync(".github/workflows/agent-conformance.yml", "utf8");
          const pinned = [...workflow.matchAll(/- id:\s*(\S+)\s*\r?\n\s*install:\s*([^\r\n]+)/g)].map((match) => match[1]);
          const shipped = registry.agents.map((profile) => profile.id).sort();
          const duplicates = pinned.filter((id, index) => pinned.indexOf(id) !== index);
          const missing = shipped.filter((id) => !pinned.includes(id));
          const unknown = pinned.filter((id) => !shipped.includes(id));
          if (duplicates.length || missing.length || unknown.length) {
            throw new Error(`pinned probe coverage mismatch: missing=${missing} unknown=${unknown} duplicates=${duplicates}`);
          }
          console.log(`pinned probe coverage: ${shipped.join(", ")}`);
          NODE
      - name: Install CLI build dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock --prefix packages/cli
      - name: Build CLI
        run: npm --prefix packages/cli run build
      - name: Build real proxy and compression engine
        run: go build -o "$RUNNER_TEMP/caveman-proxy" ./proxy/cmd/caveman-proxy
      - name: Run every profile through real compression
        env:
          CAVEMAN_TEST_PROXY_BIN: ${{ runner.temp }}/caveman-proxy
        run: node --test --test-force-exit packages/cli/tests/agent-compression-conformance.runtime.mjs

  pinned-upstream-binary:
    if: false
    name: pinned binary / ${{ matrix.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: aider
            install: python -m pip install aider-chat==0.86.2
          - id: claude
            install: npm install -g @anthropic-ai/claude-code@2.1.259
          - id: codex
            install: npm install -g @openai/codex@0.153.0
          - id: gemini
            install: npm install -g @google/gemini-cli@0.58.0
          - id: hermes
            install: python -m pip install --editable "git+https://github.com/NousResearch/hermes-agent.git@1f8acb340f9c72aec1426248cca54139816a77f5#egg=hermes-agent" # immutable source version @0.19.1; editable install preserves source assets
          - id: kilo
            install: npm install -g @kilocode/cli@7.5.9
          - id: openclaw
            install: npm install -g openclaw@2026.8.2
          - id: opencode
            install: npm install -g opencode-ai@1.18.27
          - id: pi
            install: npm install -g --ignore-scripts @earendil-works/pi-coding-agent@0.84.4
          - id: qwen
            install: npm install -g @qwen-code/qwen-code@0.22.3
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.16.0"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install pinned upstream binary
        run: ${{ matrix.install }}
      - name: Check Hermes dependencies
        if: matrix.id == 'hermes'
        run: |
          python -m pip freeze
          python -m pip check
      - name: Probe isolated version and help surfaces
        run: node agents/probe-installed.mjs --require "${{ matrix.id }}"

  latest-drift-probe:
    name: latest drift / ${{ matrix.id }}
    if: false
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: aider
            install_latest: python -m pip install --upgrade aider-chat
          - id: claude
            install_latest: npm install -g @anthropic-ai/claude-code@latest
          - id: codex
            install_latest: npm install -g @openai/codex@latest
          - id: gemini
            install_latest: npm install -g @google/gemini-cli@latest
          - id: hermes
            install_latest: python -m pip install --editable "git+https://github.com/NousResearch/hermes-agent.git@main#egg=hermes-agent"
          - id: kilo
            install_latest: npm install -g @kilocode/cli@latest
          - id: openclaw
            install_latest: npm install -g openclaw@latest
          - id: opencode
            install_latest: npm install -g opencode-ai@latest
          - id: pi
            install_latest: npm install -g --ignore-scripts @earendil-works/pi-coding-agent@latest
          - id: qwen
            install_latest: npm install -g @qwen-code/qwen-code@latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.16.0"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # Current Hermes dependencies are declared only for Python >= 3.14.
          python-version: ${{ matrix.id == 'hermes' && '3.14' || '3.12' }}
      - id: install
        name: Install current upstream binary
        run: ${{ matrix.install_latest }}
      - name: Check Hermes dependencies
        if: matrix.id == 'hermes'
        run: |
          python -m pip freeze
          python -m pip check
      - name: Report installation failure
        if: ${{ always() && steps.install.outcome == 'failure' }}
        env:
          AGENT_ID: ${{ matrix.id }}
        run: |
          echo "::warning::Latest $AGENT_ID installation failed; no probe result was produced."
          echo "Latest $AGENT_ID installation failed; no probe result was produced. See the install step log." >> "$GITHUB_STEP_SUMMARY"
      - id: probe
        name: Probe latest binary without blocking pinned conformance
        if: ${{ always() && steps.install.outcome == 'success' }}
        continue-on-error: true
        run: |
          mkdir -p agent-probes
          node agents/probe-installed.mjs --require "${{ matrix.id }}" --allow-newer --json > "agent-probes/${{ matrix.id }}.json"
      - name: Report probe failure
        if: ${{ always() && steps.probe.outcome == 'failure' }}
        env:
          AGENT_ID: ${{ matrix.id }}
        run: |
          echo "::warning::Latest $AGENT_ID probe failed; inspect the probe artifact."
          echo "Latest $AGENT_ID probe failed; inspect the probe artifact." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload untrusted probe result
        if: ${{ always() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-probe-${{ matrix.id }}
          path: agent-probes/${{ matrix.id }}.json
          if-no-files-found: error
          retention-days: 1

  latest-drift-report:
    name: latest drift report
    if: false
    needs: latest-drift-probe
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      # Fresh runner: upstream @latest lifecycle code never receives issue-write
      # credentials and cannot rewrite the trusted reporter used here.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Download probe results
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: agent-probe-*
          path: ${{ runner.temp }}/agent-probes
          merge-multiple: true
      - name: Open or update drift issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          probes=("$RUNNER_TEMP"/agent-probes/*.json)
          if (( ${#probes[@]} == 0 )); then
            echo "no latest-agent probe results were produced"
            exit 0
          fi
          for probe in "${probes[@]}"; do
            expected_id="$(basename "$probe" .json)"
            if ! node agents/drift-report.mjs --input "$probe" --expected-id "$expected_id"; then
              echo "::warning file=$probe::invalid agent drift probe"
            fi
          done

  integration:
    name: Hermes integration / ${{ matrix.profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: pinned
            python: "3.12"
            ref: "1f8acb340f9c72aec1426248cca54139816a77f5"
          - profile: latest
            python: "3.14"
            ref: "c54637da854af6fc4eb3bbfc55093feda1f93465"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.16.0"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install and build CLI
        run: |
          npm install --ignore-scripts --no-audit --no-fund --no-package-lock --prefix packages/cli
          npm --prefix packages/cli run build
      - name: Linux wrapper and drift regression tests
        run: |
          node --test tests/installer/agent-registry-drift.test.mjs tests/installer/hermes.test.mjs packages/cli/tests/hermes-wrap.runtime.mjs
          node --test --test-name-pattern=hermes packages/cli/tests/hooks.runtime.mjs
      - name: Install real Hermes
        run: |
          python -m pip install --editable "git+https://github.com/NousResearch/hermes-agent.git@${{ matrix.ref }}#egg=hermes-agent"
          python -m pip check
      - name: Actual Hermes plugin, auth and local provider smoke
        run: |
          cat > "$RUNNER_TEMP/hermes-integration.py" <<'PY'
          import os, json, tempfile, subprocess, pathlib, threading
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          root = pathlib.Path.cwd()
          home = pathlib.Path(tempfile.mkdtemp(prefix="hermes-integration-"))
          os.environ.update(HOME=str(home), HERMES_HOME=str(home / ".hermes"), CAVEMAN_HOME=str(home / ".caveman"), CAVE_NO_KEYCHAIN="1", NO_COLOR="1")
          for key in list(os.environ):
              if key.endswith("_API_KEY") or key in ("CAVE_TOKEN", "GH_TOKEN", "GITHUB_TOKEN"):
                  os.environ.pop(key, None)
          (home / ".caveman-cloud").mkdir()
          (home / ".caveman-cloud" / "config.json").write_text(json.dumps({"wrap":{"proxy":False,"shrink":False,"mcp":False,"browse":False}}))
          cli = str(root / "packages/cli/dist/index.js")
          subprocess.run(["node", cli, "hooks", "install", "hermes"], check=True, timeout=30)
          from hermes_cli.plugins import get_plugin_manager
          manager = get_plugin_manager()
          manager.discover_and_load()
          plugins = manager.list_plugins()
          matched = [p for p in plugins if p["name"] == "caveman_shrink"]
          print("PLUGIN", json.dumps(matched), flush=True)
          assert len(matched) == 1 and matched[0]["enabled"] and not matched[0].get("error")
          assert matched[0]["hooks"] >= 1
          result = manager.invoke_hook("transform_terminal_output", command="echo hello", output="hello")
          print("PLUGIN_SMALL_OUTPUT", repr(result), flush=True)
          from hermes_cli.runtime_provider import resolve_runtime_provider
          os.environ["CUSTOM_BASE_URL"] = "https://gateway.example-cave.com/w/hermes"
          os.environ["EXAMPLE_CAVE_API_KEY"] = "cave_validation_dummy"
          runtime = resolve_runtime_provider(requested="custom")
          assert runtime["api_key"] == "cave_validation_dummy", {k:v for k,v in runtime.items() if k != "api_key"}
          assert "gateway.example-cave.com/w/hermes" in runtime["base_url"], runtime["base_url"]
          print("MANAGED_AUTH_RESOLVER_OK", runtime["base_url"], flush=True)
          os.environ.pop("EXAMPLE_CAVE_API_KEY")
          requests = []
          class Handler(BaseHTTPRequestHandler):
              def log_message(self, *args): pass
              def do_GET(self):
                  self.send_response(200); self.send_header("Content-Type", "application/json"); self.end_headers()
                  self.wfile.write(json.dumps({"object":"list","data":[{"id":"gpt-4o-mini","object":"model"}]}).encode())
              def do_POST(self):
                  body = json.loads(self.rfile.read(int(self.headers.get("Content-Length",0))))
                  requests.append({"path":self.path,"body":body})
                  self.send_response(200); self.send_header("Content-Type", "application/json"); self.end_headers()
                  self.wfile.write(json.dumps({"id":"chatcmpl-validation","object":"chat.completion","created":1,"model":"gpt-4o-mini","choices":[{"index":0,"message":{"role":"assistant","content":"HERMES_INTEGRATION_OK"},"finish_reason":"stop"}],"usage":{"prompt_tokens":12,"completion_tokens":4,"total_tokens":16}}).encode())
          server=ThreadingHTTPServer(("127.0.0.1",0), Handler)
          threading.Thread(target=server.serve_forever,daemon=True).start()
          base=f"http://127.0.0.1:{server.server_port}"
          os.environ.update(CAVE_GATEWAY_URL=base, OPENAI_API_KEY="sk-validation-dummy")
          os.environ.pop("CUSTOM_BASE_URL",None)
          try:
              run=subprocess.run(["node",cli,"wrap","hermes","-z","Reply with HERMES_INTEGRATION_OK","-m","gpt-4o-mini","-t","none"],capture_output=True,text=True,timeout=60,cwd=home)
              print("CLI_EXIT",run.returncode,flush=True)
              print("CLI_STDOUT",run.stdout[-6000:],flush=True)
              print("CLI_STDERR",run.stderr[-6000:],flush=True)
              print("REQUEST_PATHS",json.dumps([r["path"] for r in requests]),flush=True)
              assert run.returncode == 0, "Actual Hermes CLI failed"
              assert requests, "No actual Hermes request reached the local provider"
              assert all(r["path"].startswith("/w/hermes") for r in requests), "Routing prefix missing"
              assert "HERMES_INTEGRATION_OK" in run.stdout, "Provider response not propagated"
              print("ACTUAL_HERMES_ROUTING_OK",flush=True)
          finally:
              server.shutdown()
          
          PY
          python "$RUNNER_TEMP/hermes-integration.py"
