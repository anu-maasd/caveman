name: agent-conformance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    name: Hermes integration / ${{ matrix.profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: pinned
            python: "3.12"
            ref: "1f8acb340f9c72aec1426248cca54139816a77f5"
          - profile: latest
            python: "3.14"
            ref: "c54637da854af6fc4eb3bbfc55093feda1f93465"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.16.0"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install and build CLI
        run: |
          npm install --ignore-scripts --no-audit --no-fund --no-package-lock --prefix packages/cli
          npm --prefix packages/cli run build
      - name: Linux wrapper and drift regression tests
        run: |
          node --test tests/installer/agent-registry-drift.test.mjs tests/installer/hermes.test.mjs packages/cli/tests/hermes-wrap.runtime.mjs
          node --test --test-name-pattern=hermes packages/cli/tests/hooks.runtime.mjs
      - name: Install real Hermes
        run: |
          python -m pip install --editable "git+https://github.com/NousResearch/hermes-agent.git@${{ matrix.ref }}#egg=hermes-agent"
          python -m pip check
      - name: Actual Hermes plugin, auth and local provider smoke
        run: |
          cat > "$RUNNER_TEMP/hermes-integration.py" <<'PY'
          import os, json, tempfile, subprocess, pathlib, threading
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          root = pathlib.Path.cwd()
          home = pathlib.Path(tempfile.mkdtemp(prefix="hermes-integration-"))
          os.environ.update(HOME=str(home), HERMES_HOME=str(home / ".hermes"), CAVEMAN_HOME=str(home / ".caveman"), CAVE_NO_KEYCHAIN="1", NO_COLOR="1")
          for key in list(os.environ):
              if key.endswith("_API_KEY") or key in ("CAVE_TOKEN", "GH_TOKEN", "GITHUB_TOKEN"):
                  os.environ.pop(key, None)
          (home / ".caveman-cloud").mkdir()
          (home / ".caveman-cloud" / "config.json").write_text(json.dumps({"wrap":{"proxy":False,"shrink":False,"mcp":False,"browse":False}}))
          cli = str(root / "packages/cli/dist/index.js")
          subprocess.run(["node", cli, "hooks", "install", "hermes"], check=True, timeout=30)
          from hermes_cli.plugins import get_plugin_manager
          manager = get_plugin_manager()
          manager.discover_and_load()
          plugins = manager.list_plugins()
          matched = [p for p in plugins if p["name"] == "caveman_shrink"]
          print("PLUGIN", json.dumps(matched), flush=True)
          assert len(matched) == 1 and matched[0]["enabled"] and not matched[0].get("error")
          assert matched[0]["hooks"] >= 1
          result = manager.invoke_hook("transform_terminal_output", command="echo hello", output="hello")
          print("PLUGIN_SMALL_OUTPUT", repr(result), flush=True)
          from hermes_cli.runtime_provider import resolve_runtime_provider
          os.environ["CUSTOM_BASE_URL"] = "https://gateway.example-cave.com/w/hermes"
          os.environ["EXAMPLE_CAVE_API_KEY"] = "cave_validation_dummy"
          runtime = resolve_runtime_provider(requested="custom")
          assert runtime["api_key"] == "cave_validation_dummy", {k:v for k,v in runtime.items() if k != "api_key"}
          assert "gateway.example-cave.com/w/hermes" in runtime["base_url"], runtime["base_url"]
          print("MANAGED_AUTH_RESOLVER_OK", runtime["base_url"], flush=True)
          os.environ.pop("EXAMPLE_CAVE_API_KEY")
          requests = []
          class Handler(BaseHTTPRequestHandler):
              def log_message(self, *args): pass
              def do_GET(self):
                  self.send_response(200); self.send_header("Content-Type", "application/json"); self.end_headers()
                  self.wfile.write(json.dumps({"object":"list","data":[{"id":"gpt-4o-mini","object":"model"}]}).encode())
              def do_POST(self):
                  body = json.loads(self.rfile.read(int(self.headers.get("Content-Length",0))))
                  requests.append({"path":self.path,"body":body})
                  self.send_response(200); self.send_header("Content-Type", "application/json"); self.end_headers()
                  self.wfile.write(json.dumps({"id":"chatcmpl-validation","object":"chat.completion","created":1,"model":"gpt-4o-mini","choices":[{"index":0,"message":{"role":"assistant","content":"HERMES_INTEGRATION_OK"},"finish_reason":"stop"}],"usage":{"prompt_tokens":12,"completion_tokens":4,"total_tokens":16}}).encode())
          server=ThreadingHTTPServer(("127.0.0.1",0), Handler)
          threading.Thread(target=server.serve_forever,daemon=True).start()
          base=f"http://127.0.0.1:{server.server_port}"
          os.environ.update(CAVE_GATEWAY_URL=base, OPENAI_API_KEY="sk-validation-dummy")
          os.environ.pop("CUSTOM_BASE_URL",None)
          try:
              run=subprocess.run(["node",cli,"wrap","hermes","-q","Reply with HERMES_INTEGRATION_OK","-m","gpt-4o-mini","-t","none"],capture_output=True,text=True,timeout=60,cwd=home)
              print("CLI_EXIT",run.returncode,flush=True)
              print("CLI_STDOUT",run.stdout[-6000:],flush=True)
              print("CLI_STDERR",run.stderr[-6000:],flush=True)
              print("REQUEST_PATHS",json.dumps([r["path"] for r in requests]),flush=True)
              assert run.returncode == 0, "Actual Hermes CLI failed"
              assert requests, "No actual Hermes request reached the local provider"
              assert all(r["path"].startswith("/w/hermes") for r in requests), "Routing prefix missing"
              assert "HERMES_INTEGRATION_OK" in run.stdout, "Provider response not propagated"
              print("ACTUAL_HERMES_ROUTING_OK",flush=True)
          finally:
              server.shutdown()
          
          PY
          python "$RUNNER_TEMP/hermes-integration.py"
